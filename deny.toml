# cargo-deny settings. CI runs `cargo deny check` (advisories, bans, licenses
# and sources) on every push and pull request; every advisory ignored here says
# why it doesn't apply.

[advisories]
ignore = [
    # rsa 0.9 (Marvin) and crypto-bigint 0.5 (under p256): timing side
    # channels in private-key operations. The app does no private-key
    # operation whose timing can be measured remotely: the agent signs, and
    # the browser pairing's ECDH runs locally. ssh-key 0.6 pins both; they
    # can go once ssh-key moves to the fixed versions (sshkm-core with it).
    { id = "RUSTSEC-2023-0071", reason = "no remotely timed private-key operations; waiting for ssh-key to move to a fixed rsa" },
    { id = "RUSTSEC-2026-0387", reason = "no remotely timed private-key operations; waiting for ssh-key to move to crypto-bigint 0.7" },
    # zvariant, zbus_names and zvariant_derive are unmaintained since zbus 6
    # merged them. zbus 5 comes with the Tauri plugins, secret-service and
    # robius-authentication, so it stays until they move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: part of zbus 5, which the Tauri plugins and keyring crates still use" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: part of zbus 5, which the Tauri plugins and keyring crates still use" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: part of zbus 5, which the Tauri plugins and keyring crates still use" },
    # proc-macro-error is unmaintained; glib-macros (the GTK bindings Tauri
    # uses on Linux) needs it at build time. No release without it yet.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, through glib-macros of Tauri's GTK bindings; no fixed version" },
]

# Every crate comes from crates.io: a git dependency or another registry fails.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Tauri's dependencies bring several versions of some crates; that only warns.
multiple-versions = "warn"
# A dependency without a version requirement fails. The workspace's own crates
# depend on each other by path, which is fine: none of them is published.
wildcards = "deny"
allow-wildcard-paths = true

# The app is AGPL-3.0-only, so it ships only code under licenses that allow
# that: permissive ones, and MPL-2.0, whose files stay under it. A crate under
# any other license fails until someone checks it and adds it here.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # The root certificates in webpki-root-certs: data, with the notice kept.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# The workspace's own crates (AGPL-3.0-only, not published).
[licenses.private]
ignore = true
