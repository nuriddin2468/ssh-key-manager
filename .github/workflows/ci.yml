name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    # A release commit only bumps the version; release.yml builds it from its tag.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  changelog:
    name: Release notes
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The pull request's base, to tell whether it adds a note.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Fails on a broken note; only warns about a pull request without one.
      - name: Check the release notes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/changelog.mjs check ${BASE:+--since "$BASE"}

  rust:
    name: Rust (${{ matrix.os }})
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No debug info: faster to compile and link (Windows most of all) and a
      # smaller cache. Panics still report the file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Saved even when a step fails; otherwise one red job leaves every later
      # run of it building all dependencies from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # tauri::generate_context! embeds the built frontend, so it must exist.
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The phone builds the core without the features only computers use.
      - name: Core and bridge without default features
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p sshkm-core -p sshkm-mobile --no-default-features --all-targets -- -D warnings
          cargo test -p sshkm-core -p sshkm-mobile --no-default-features
      - name: Bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/bindings

  android:
    name: Android
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: android
      # The Rust library is built for each ABI with cargo-ndk, linked with the
      # NDK the app names (mobile/android/app/build.gradle.kts).
      - name: Install cargo-ndk and the NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null
      # Checks the wrapper's checksum and caches Gradle's downloads.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint, test and build the APK
        working-directory: mobile/android
        run: ./gradlew lint test assembleDebug
      # Debug builds can load a made-up vault (the Rust feature `test-vault`
      # and its Kotlin binding); a release build must have neither. One ABI
      # is enough to tell.
      - name: Build the release APK, without the test vault
        working-directory: mobile/android
        run: |
          ./gradlew -PrustAbis=arm64-v8a assembleRelease
          bindings=kotlin/dev/sshkeymanager/android/core/sshkm_mobile.kt
          library=jniLibs/arm64-v8a/libsshkm_mobile.so
          # The check finds it where it is...
          grep -q receiveTestVault "app/build/rust/debug/$bindings"
          grep -aq receive_test_vault "app/build/rust/debug/$library"
          # ...and the release build doesn't have it.
          if grep -q receiveTestVault "app/build/rust/release/$bindings" \
            || grep -aq receive_test_vault "app/build/rust/release/$library"; then
            echo "::error::The release build has the debug-only test vault."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  dependencies:
    name: Dependencies
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
      # cargo-deny's release build, checked against the checksum of the
      # version named here.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # Known vulnerable, unmaintained or yanked crates in Cargo.lock, crates
      # from anywhere but crates.io, and licenses the app can't be shipped
      # with; deny.toml says what is allowed and why.
      - run: cargo deny --all-features check
