[package]
name = "sshkm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core library of SSH Key Manager: OpenSSH keys, ssh_config, known_hosts, ssh-agent, permissions and audit"
readme = "README.md"
publish = false

[dependencies]
aes-gcm = "0.10.3"
# The leak scanner looks for every secret at once; the version regex already
# brings in, so this adds no crate to the build.
aho-corasick = "1.1.5"
# Reading the logins browsers keep (vault/import/browser): AES-CBC, and
# Triple DES for older Firefox profiles. The versions aes-gcm and ssh-key use.
aes = "0.8.4"
cbc = "0.1.2"
base64ct = "1.8.3"
chacha20poly1305 = "0.11.0"
# Decrypting a sync copy's payload before the `keepass` crate reads it
# (vault/sync/payload.rs): the versions that crate builds, so these add no
# crate.
chacha20 = "0.10"
twofish = "0.8"
chrono = { version = "0.4.23", default-features = false, features = ["std"] }
csv = "1.4.0"
des = "0.8.1"
diceware_wordlists = "1.2.3"
dirs = "7.0.0"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hkdf = "0.12.4"
hmac = "0.12"
keepass = { version = "0.17.0", features = ["save_kdbx4", "totp"] }
# MD5 fingerprints, and keys of PEM files that OpenSSL encrypted.
md-5 = "0.10"
# Encrypted PKCS#8 keys.
pbkdf2 = "0.12"
p256 = { version = "0.13", features = ["ecdh", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["pem", "pkcs8"] }
p521 = { version = "0.13", features = ["pem", "pkcs8"] }
psl = "2.1.246"
rand_core = { version = "0.6", features = ["getrandom"] }
# The SQLite databases browsers keep their logins in, read from a private copy.
rusqlite = { version = "0.41.1", features = ["bundled"] }
rsa = { version = "0.9", features = ["pem", "std"] }
rust-argon2 = "3.0.0"
# The Tools page's TLS check; the versions and features the updater already
# builds, so these add no crate.
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.10"
subtle = "2.6"
ssh-encoding = { version = "0.2", features = ["std", "base64"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption", "std", "getrandom"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "macros", "parsing", "std"] }
trash = "5.2.9"
url = "2.5.8"
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }
uuid = "1.18.1"
zeroize = "1.9.1"
zxcvbn = { version = "3.1.1", default-features = false }

[target.'cfg(unix)'.dependencies]
# Opening a managed `.env` file without following a link or waiting on a
# pipe (vault/envs/files/disk.rs). Already in the build.
libc = "0.2.191"
# Making a private file, and reading and writing a managed `.env` file,
# through a folder held open (`openat`, `renameat`, …; fsutil/private_folder.rs
# on macOS, vault/envs/files/folder.rs) without unsafe code. The version
# `tempfile` already builds.
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# Keeping a level-2 `.env` file out of Time Machine and cloud folders
# (fsutil.rs). The version the updater's `tar` already builds.
xattr = { version = "1.7.0", default-features = false }

[target.'cfg(windows)'.dependencies]
# Creates a CSV export with its access list in place (perms/private_file.rs).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
# The DNS servers of the network adapters (net/dns.rs); already in the build.
windows-registry = "0.6.1"

# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`:
# five modules opt in with `#![allow(unsafe_code)]`: `perms/private_file.rs`
# (Windows) creates files with their access list through Win32,
# `perms/extended_acl.rs` (macOS) empties the access list of the folder a
# private file is made in through the system library, the Unix part of
# `vault/envs/files/pipes.rs` makes and serves named pipes through libc,
# the Windows part of `vault/envs/files/folder.rs` asks Win32 for the path of
# a folder it holds open, and `agent/peer.rs` (Unix) asks libc which user
# serves the agent's socket.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3.27.0"
