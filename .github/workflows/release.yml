name: Release

# Builds installers for every platform when a version tag is pushed, signs
# the update bundles and attaches everything to a draft GitHub release,
# together with the latest.json manifest that the in-app updater reads. Then
# the release is published and installed apps offer the update. If any build
# fails, nothing is signed or released.
#
# Required: TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if
# the key has one), the private half of plugins.updater.pubkey in tauri.conf.json,
# as secrets of the `release` environment. Only the `sign` job uses that
# environment, and only its signing step gets the key. The job runs on a fresh
# runner that never builds or installs the app's code: it downloads each
# platform's bundles into a folder of their own, takes only the kinds of file
# that platform makes, signs the update bundles with the Tauri CLI from the
# lockfile (installed without running any package scripts, and run by Node
# itself, an exact version), and uploads them. Code that runs while building
# (build scripts, proc macros, npm packages) never shares a machine with the
# key, and one platform's build can't hand in another platform's files.
#
# Release builds restore no caches: CI saves its caches after running
# development tools (linters, test runners), so a release builds from the
# lockfiles alone.
#
# Optional Apple code signing and notarization run in the macOS build job, with
# these secrets of the `apple-signing` environment, which only that job uses
# (not `release`: build code runs there, and must not share a machine with the
# updater key). Limit the environment to `v*` tags:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Without them the macOS build still succeeds, unsigned. Windows installers
# aren't code-signed yet (README, "Code signing policy").
#
# The release notes come from changelog/releases.json, which
# `node scripts/changelog.mjs release <version>` fills in (changelog/README.md).
# The GitHub release shows the version's section of CHANGELOG.md, and
# latest.json carries the notes of the last releases in every language, for the
# app to show before it updates. A tag without notes for its version fails
# before anything is built.
#
# Once the release is published, the browser extension of the same version goes
# to the stores for review (the `extension-stores` job, with the secrets of the
# `extension-stores` environment; .github/scripts/extension_stores.py names
# them). A store without its secrets is skipped. The extension is built in a
# job without secrets, as the app is, and the store job only uploads what it
# built.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            environment: apple-signing
          - platform: ubuntu-22.04
            target: ""
            environment: ""
          - platform: windows-latest
            target: ""
            environment: ""
    runs-on: ${{ matrix.platform }}
    # The Apple signing secrets, for the macOS build only. The other builds
    # use no environment.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # No pnpm or Rust cache (see the top of this file).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the release notes
        run: node scripts/changelog.mjs check
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      # With createUpdaterArtifacts on, `tauri build` signs the update bundles
      # itself and fails without a key, after bundling. It gets a throwaway
      # key; its signatures are left here, and the sign job signs the bundles
      # again with the real one.
      - name: Make a throwaway updater key
        shell: bash
        run: pnpm tauri signer generate --ci -w "$RUNNER_TEMP/throwaway.key"
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Tauri signs and notarizes as soon as APPLE_CERTIFICATE is set, even
          # to an empty string, so the variables stay only when the secret exists.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/throwaway.key" \
            pnpm tauri build ${TARGET:+--target "$TARGET"} --config src-tauri/tauri.release.conf.json
      # The files to release, named as tauri-action named the release assets:
      # GitHub turns spaces into dots, and the macOS update bundle carries its
      # architecture. Only the kinds this system makes: whatever else is in
      # the bundle folder stays behind, the throwaway signatures too.
      - name: Collect the installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir "$out"
          bundle="target/${TARGET:+$TARGET/}release/bundle"
          case $RUNNER_OS in
            macOS) files=("$bundle"/dmg/*.dmg "$bundle"/macos/*.app.tar.gz) ;;
            Windows) files=("$bundle"/msi/*.msi "$bundle"/nsis/*-setup.exe) ;;
            Linux) files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage) ;;
            *) echo "unexpected system: $RUNNER_OS"; exit 1 ;;
          esac
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            case $name in
              *.app.tar.gz) name="${name%.app.tar.gz}_${TARGET%%-*}.app.tar.gz" ;;
            esac
            cp "$file" "$out/${name// /.}"
          done
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ runner.os }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-latest
    # The only job in the release environment, so the only one that can read
    # the signing key, and only its signing step gets it. Required reviewers
    # set on the environment approve it once every platform has built.
    environment: release
    permissions:
      contents: write
    env:
      # Under the version's notes on the GitHub release.
      FOOTER: |-
        Which file to download: see [Download](https://github.com/nuriddin2468/ssh-key-manager#download) in the README.

        [Code signing policy](https://github.com/nuriddin2468/ssh-key-manager#code-signing-policy)
    steps:
      # For the app's version and the lockfile; nothing in it is built or run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No cache: the build jobs could have written one. Node runs the CLI
      # with the key, so it is an exact version, updated by hand.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
      # The lockfile pins @tauri-apps/cli and its checksum. Of what this
      # installs, only the CLI ever runs, and no package's install scripts do.
      - name: Install the Tauri CLI
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Each platform's files by name into a folder of their own, so no build
      # can replace another's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macOS
          path: ${{ runner.temp }}/builds/macOS
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-Linux
          path: ${{ runner.temp }}/builds/Linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-Windows
          path: ${{ runner.temp }}/builds/Windows
      # The files come from the build jobs, so only regular files with plain
      # names, one of each kind its platform makes, go on to commands, URLs and
      # the manifest.
      - name: Check the bundles
        shell: python3 -I {0}
        run: |
          import os, re, sys

          temp = os.environ["RUNNER_TEMP"]
          kinds = {
              "macOS": (".app.tar.gz", ".dmg"),
              "Linux": (".AppImage", ".deb", ".rpm"),
              "Windows": (".msi", "-setup.exe"),
          }
          updates = (".app.tar.gz", ".AppImage", ".deb", ".rpm", ".msi", "-setup.exe")
          folder = os.path.join(temp, "release")
          os.mkdir(folder)
          for system, suffixes in kinds.items():
              source = os.path.join(temp, "builds", system)
              found = []
              for name in sorted(os.listdir(source)):
                  path = os.path.join(source, name)
                  if (
                      not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name)
                      or os.path.islink(path)
                      or not os.path.isfile(path)
                      or not name.endswith(suffixes)
                  ):
                      sys.exit(f"unexpected file from the {system} build: {name!r}")
                  found += [suffix for suffix in suffixes if name.endswith(suffix)]
                  # Two files of one name stop the release; neither replaces the other.
                  if os.path.lexists(os.path.join(folder, name)):
                      sys.exit(f"two builds made {name!r}")
                  os.rename(path, os.path.join(folder, name))
              if sorted(found) != sorted(suffixes):
                  sys.exit(f"the {system} build made {sorted(found)}, not one each of {sorted(suffixes)}")
          with open(os.path.join(temp, "updates.txt"), "w", encoding="utf-8") as out:
              for name in sorted(os.listdir(folder)):
                  if name.endswith(updates):
                      out.write(f"{name}\n")
      # The only step with the key. It runs Node and the CLI, and nothing else
      # (not pnpm).
      - name: Sign the update bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          while IFS= read -r name; do
            node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" \
              "$RUNNER_TEMP/release/$name"
          done < "$RUNNER_TEMP/updates.txt"
      # Installed apps refuse a signature by another key, or one that doesn't
      # name the version latest.json offers.
      - name: Check the signatures
        shell: python3 -I {0}
        run: |
          import base64, json, os, sys

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as file:
              config = json.load(file)


          def key_id(text):
              """The ID of a minisign key or signature: bytes 2 to 9 of its second line."""
              line = base64.b64decode(text).decode().splitlines()[1]
              return base64.b64decode(line)[2:10]


          trusted = key_id(config["plugins"]["updater"]["pubkey"])
          temp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(temp, "updates.txt"), encoding="utf-8") as file:
              names = file.read().split()
          for name in names:
              with open(os.path.join(temp, "release", f"{name}.sig"), encoding="ascii") as sig:
                  text = sig.read()
              if key_id(text) != trusted:
                  sys.exit(f"{name}.sig is not by the key in plugins.updater.pubkey")
              # The trusted comment: tab-separated fields, signed with the file.
              comment = base64.b64decode(text).decode().splitlines()[2]
              if f"version:{config['version']}" not in comment.split("\t"):
                  sys.exit(f"{name}.sig doesn't name version {config['version']}: {comment!r}")
      # The manifest as tauri-action wrote it, plus the release notes. The
      # updater looks up `{os}-{arch}-{installer}` first, then `{os}-{arch}`.
      - name: Write latest.json
        shell: python3 -I {0}
        run: |
          import fnmatch, json, os, re, sys, time

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9A-Za-z._-]+", tag):
              sys.exit(f"unexpected tag: {tag}")
          with open("src-tauri/tauri.conf.json", encoding="utf-8") as file:
              version = json.load(file)["version"]
          # The build jobs checked that releases.json starts with this version
          # and that CHANGELOG.md was made from it.
          with open("changelog/releases.json", encoding="utf-8") as file:
              releases = json.load(file)
          if releases[0]["version"] != version:
              sys.exit(f"changelog/releases.json has no notes for {version}")
          with open("CHANGELOG.md", encoding="utf-8") as file:
              section = re.search(
                  rf"^## {re.escape(version)} \(.*?\)\n\n(.*?)(?=\n## |\Z)", file.read(), re.M | re.S
              )
          if not section:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          notes = section.group(1).strip()
          with open(os.path.join(os.environ["RUNNER_TEMP"], "notes.md"), "w", encoding="utf-8") as out:
              out.write(f"{notes}\n\n{os.environ['FOOTER']}\n")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          folder = os.path.join(os.environ["RUNNER_TEMP"], "release")
          files = os.listdir(folder)
          targets = {
              "*_universal.app.tar.gz": [
                  "darwin-aarch64", "darwin-x86_64", "darwin-aarch64-app", "darwin-x86_64-app",
              ],
              "*_amd64.AppImage": ["linux-x86_64", "linux-x86_64-appimage"],
              "*_amd64.deb": ["linux-x86_64-deb"],
              "*.x86_64.rpm": ["linux-x86_64-rpm"],
              "*_x64_*.msi": ["windows-x86_64", "windows-x86_64-msi"],
              "*_x64-setup.exe": ["windows-x86_64-nsis"],
          }
          platforms = {}
          for pattern, keys in targets.items():
              found = fnmatch.filter(files, pattern)
              if len(found) != 1:
                  sys.exit(f"expected one {pattern}, found {found}")
              with open(os.path.join(folder, found[0] + ".sig"), encoding="ascii") as sig:
                  signature = sig.read()
              for key in keys:
                  platforms[key] = {"signature": signature, "url": f"{base}/{found[0]}"}
          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "platforms": platforms,
              # The app lists every version newer than its own from here, so
              # someone a few releases behind sees what each one changed.
              "changelog": releases[:20],
          }
          with open(os.path.join(folder, "latest.json"), "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=2)
          print(json.dumps(manifest, indent=2))
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/release"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "SSH Key Manager $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ./*
          fi

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No pnpm cache, as in the app's builds.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm extension:package
      # The stores get the version the tag names, which the app has too.
      - name: Check the version
        shell: python3 -I {0}
        run: |
          import json, os, sys

          tag = os.environ["GITHUB_REF_NAME"]
          with open("src-tauri/tauri.conf.json", encoding="utf-8") as file:
              app = json.load(file)["version"]
          with open("extension/manifest.json", encoding="utf-8") as file:
              extension = json.load(file)["version"]
          if not tag == f"v{app}" == f"v{extension}":
              sys.exit(f"tag {tag}, app {app}, extension {extension}: they must agree")
      # addons.mozilla.org reviewers rebuild the bundled scripts from this.
      - name: Pack the source
        run: git archive --format=zip -o "extension/dist/ssh-key-manager-source-${GITHUB_REF_NAME#v}.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: extension/dist/ssh-key-manager-*.zip
          if-no-files-found: error
          retention-days: 7

  extension-stores:
    needs: [extension, publish]
    runs-on: ubuntu-latest
    # The only job that can read the stores' credentials. It runs nothing from
    # the build: the upload script uses Python's standard library alone.
    environment: extension-stores
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension
          path: ${{ runner.temp }}/extension
      # Each store on its own: one failing doesn't keep the others from trying.
      - name: Chrome Web Store
        if: ${{ !cancelled() }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: python3 -I .github/scripts/extension_stores.py chrome "$RUNNER_TEMP/extension" "${GITHUB_REF_NAME#v}"
      - name: Firefox Add-ons
        if: ${{ !cancelled() }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python3 -I .github/scripts/extension_stores.py firefox "$RUNNER_TEMP/extension" "${GITHUB_REF_NAME#v}"
      - name: Edge Add-ons
        if: ${{ !cancelled() }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: python3 -I .github/scripts/extension_stores.py edge "$RUNNER_TEMP/extension" "${GITHUB_REF_NAME#v}"
