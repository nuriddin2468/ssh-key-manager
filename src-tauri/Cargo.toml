[package]
name = "sshkm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "SSH Key Manager desktop app"
publish = false

[lib]
name = "sshkm_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sshkm-core = { path = "../crates/sshkm-core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
log = "0.4"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "alloc"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "std"] }
gethostname = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
sshkm-core = { path = "../crates/sshkm-core", features = ["ts"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[lints]
workspace = true
