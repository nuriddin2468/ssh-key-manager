[package]
name = "sshkm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "SSH Key Manager desktop app"
publish = false

[lib]
name = "sshkm_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sshkm-core = { path = "../crates/sshkm-core" }
# The tray icon; `image-png` reads its macOS template image.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
log = "0.4"
mdns-sd = "0.21"
notify = "8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "alloc"] }
subtle = "2.6"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "std"] }
gethostname = "1"
dirs = "7.0.0"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
tempfile = "3"
# Reads the terminal's mode (raw = ssh's session started). The version
# portable-pty uses, so this adds no crate to the build.
nix = { version = "0.28", default-features = false, features = ["term", "user"] }

# Named pipes for the askpass server. Tauri already depends on tokio with these
# features, so this adds no crate to the build.
[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "rt", "io-util", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.7", features = ["wayland-data-control"] }
# The in-app terminal: a PTY (ConPTY on Windows) per ssh session.
portable-pty = "0.9"
sshkm-os = { path = "../crates/sshkm-os" }
# The quick search window's system-wide shortcut.
tauri-plugin-global-shortcut = "2"
# A native question whose default and Escape mean no (confirm.rs): the dialog
# plugin's own `rfd`, which tells Escape apart from the second button. Its
# features come from the plugin, so this adds no crate to the build.
rfd = { version = "0.17", default-features = false }
# "Open at login" (src/autostart.rs): a launch agent on macOS, the Run key on
# Windows, an XDG autostart entry on Linux. The crate `tauri-plugin-autostart`
# wraps, used directly to quote the program's path and to name the app's
# bundle in its launch agent, which the plugin doesn't let through.
auto-launch = "0.6"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Compares release versions, as the updater does; the version it uses, so this
# adds no crate to the build.
semver = "1"
# The audit's breach check (commands/audit_checks.rs) asks Have I Been Pwned
# over HTTPS with the HTTP client, TLS provider and timer the updater
# already uses, so these add no crate to the build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
sshkm-core = { path = "../crates/sshkm-core", features = ["ts"] }
# The mock runtime, to check what each window's capability allows.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[lints]
workspace = true
