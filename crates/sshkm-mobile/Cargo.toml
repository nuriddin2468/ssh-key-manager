[package]
name = "sshkm-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The phone app's bridge to the core of SSH Key Manager, through UniFFI"
readme = "README.md"
publish = false

[lib]
# `cdylib` is the library the Android app loads; `lib` is for the tests and
# the `uniffi-bindgen` program.
crate-type = ["cdylib", "lib"]

# Writes the Kotlin bindings from the built library (`mobile/android` runs it).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
# Async callback interfaces (UniFFI's generated code names it).
async-trait = "0.1.92"
# Without the features only computers use (ssh-agent, `~/.ssh` audit, trash,
# browser import, shell history, leak scanner, `.env` files on disk, tunnels).
sshkm-core = { path = "../sshkm-core", default-features = false }
# The phone's SSH client, on a runtime of the bridge's own (`ssh.rs`).
sshkm-ssh = { path = "../sshkm-ssh" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
# The bindings generator's runtime half. MPL-2.0, which deny.toml allows.
uniffi = { version = "0.32.2", default-features = false }
zeroize = "1.9.1"

[dev-dependencies]
# A server for the bridge's own test, and the phone's kind of key; both
# already in the build through sshkm-ssh.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread"] }

[features]
# The `uniffi-bindgen` program: only the machine that builds the app runs it.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

# The workspace lints, `forbid(unsafe_code)` included: UniFFI's scaffolding
# is `unsafe`, but it comes from its macros, where rustc doesn't report the
# lint (see lib.rs).
[lints]
workspace = true
