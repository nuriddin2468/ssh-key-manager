[package]
name = "sshkm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Core library of SSH Key Manager: OpenSSH keys, ssh_config, known_hosts, ssh-agent, permissions and audit"
readme = "README.md"
publish = false

[dependencies]
aes-gcm = "0.10.3"
# Reading the logins browsers keep (vault/import/browser): AES-CBC, and
# Triple DES for older Firefox profiles. The versions aes-gcm and ssh-key use.
aes = "0.8.4"
cbc = "0.1.2"
base64ct = "1.8.3"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.23", default-features = false, features = ["std"] }
csv = "1.4.0"
des = "0.8.1"
diceware_wordlists = "1.2.3"
dirs = "7.0.0"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
hkdf = "0.12.4"
hmac = "0.12"
keepass = { version = "0.17.0", features = ["save_kdbx4", "totp"] }
# MD5 fingerprints, and keys of PEM files that OpenSSL encrypted.
md-5 = "0.10"
# Encrypted PKCS#8 keys.
pbkdf2 = "0.12"
p256 = { version = "0.13", features = ["ecdh", "pem", "pkcs8"] }
p384 = { version = "0.13", features = ["pem", "pkcs8"] }
p521 = { version = "0.13", features = ["pem", "pkcs8"] }
psl = "2.1.246"
rand_core = { version = "0.6", features = ["getrandom"] }
# The SQLite databases browsers keep their logins in, read from a private copy.
rusqlite = { version = "0.41.1", features = ["bundled"] }
rsa = { version = "0.9", features = ["pem", "std"] }
rust-argon2 = "3.0.0"
# The Tools page's TLS check; the versions and features the updater already
# builds, so these add no crate.
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.10"
subtle = "2.6"
ssh-encoding = { version = "0.2", features = ["std", "base64"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption", "std", "getrandom"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "macros", "parsing", "std"] }
trash = "5.2.9"
url = "2.5.8"
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }
uuid = "1.18.1"
zeroize = "1.9.1"
zxcvbn = { version = "3.1.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Creates a CSV export with its access list in place (perms/private_file.rs).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
# The DNS servers of the network adapters (net/dns.rs); already in the build.
windows-registry = "0.6.1"

# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`:
# one Windows module, `perms/private_file.rs`, creates files with their access
# list through Win32 and opts in with `#![allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3.27.0"
