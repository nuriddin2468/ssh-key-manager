[package]
name = "sshkm-os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OS integration for SSH Key Manager: screen-lock events, biometrics and the system credential store"
readme = "README.md"
publish = false

# The credential store uses the keyring 4.x ecosystem the way its documentation
# recommends for applications: `keyring-core` plus the platform stores, picked
# and configured here (these are the same crates `keyring = "4"` bundles).
[dependencies]
keyring-core = "1.0.1"
secrecy = "0.10.3"
thiserror = "2.0.21"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
robius-authentication = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
# `keychain` is the regular (file-based) keychain; `protected` would be the
# data-protection keychain, which needs a provisioning profile.
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
block2 = "0.6.2"
objc2 = "0.6.5"
# The app in front, to give it the focus back (`focus`). The version Tauri's
# windowing uses, so this adds no crate to the build.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSString", "NSError", "NSURL"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "LABiometryType"] }
# Whether System Settings lets the app's launch agent run (`login_item`). The
# version `auto-launch` uses, so this adds no crate to the build.
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
# The Keychain item of a Chromium browser, to import its saved logins
# (`browser_keys`). The version the keychain store uses, so this adds no crate.
security-framework = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Only to check that the tray icon's AppIndicator library loads; the version
# the tray code itself uses, so this adds no crate to the build.
libloading = "0.7"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
# A Chromium browser's key in the Secret Service, to import its saved logins
# (`browser_keys`). The version the keyring store uses, so this adds no crate.
secret-service = { version = "5.2.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The `watch_lock` example runs the main run loop, as the app's NSApplication does.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSRunLoop"] }

# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`:
# this is the one crate that calls OS APIs through FFI. Only the platform
# modules that need it opt in with `#![allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
