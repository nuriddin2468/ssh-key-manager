<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SSH Key Manager</title>
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.56" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0F0A32" stop-opacity="0"/>
      <stop offset="1" stop-color="#0F0A32" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#shade)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
    <g transform="translate(512 512) scale(25.5) translate(-12 -12.4)">
      <ellipse cx="12" cy="13.2" rx="10.4" ry="3.8" transform="rotate(-18 12 13.2)" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.55"/>
      <g filter="url(#soft)">
        <circle cx="12" cy="9.2" r="4.1" fill="#FFFFFF"/>
        <path d="M10.4 11.6 L9.1 18.4 Q8.9 19.7 10.2 19.7 H13.8 Q15.1 19.7 14.9 18.4 L13.6 11.6 Z" fill="#FFFFFF"/>
      </g>
      <circle cx="12" cy="9.2" r="1.5" fill="#4F46E5" fill-opacity="0.9"/>
      <circle cx="20.6" cy="9.7" r="1.2" fill="#99F6E4"/>
    </g>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
</svg>
